<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green World | Create Account</title>
</head>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100dvh;
  background: #063c33;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: clamp(12px, 3.2vw, 28px);
  overflow-x: hidden;
  position: relative;
}

.bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.bg-video-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(5, 60, 45, 0.62), rgba(5, 60, 45, 0.62));
  z-index: -1;
}

body::before,
body::after {
  content: "";
  position: fixed;
  z-index: 0;
  border-radius: 50%;
  filter: blur(4px);
  pointer-events: none;
  animation: floatGlow 12s ease-in-out infinite;
}

body::before {
  width: min(42vw, 320px);
  height: min(42vw, 320px);
  top: -80px;
  left: -80px;
  background: radial-gradient(circle, rgba(183, 255, 223, 0.35), rgba(183, 255, 223, 0));
}

body::after {
  width: min(46vw, 360px);
  height: min(46vw, 360px);
  right: -120px;
  bottom: -120px;
  background: radial-gradient(circle, rgba(255, 232, 161, 0.3), rgba(255, 232, 161, 0));
  animation-delay: -5s;
}

.login-container,
.register-container {
  background: white;
  width: min(100%, 420px);
  padding: clamp(18px, 3.4vw, 40px);
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  position: relative;
  z-index: 1;
}

h1 {
  color: #2e7d32;
  margin-bottom: 10px;
}

p {
  color: #555;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px 13px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.password-wrap {
  position: relative;
  width: 100%;
  margin-bottom: 15px;
}

.password-wrap input {
  margin-bottom: 0;
  padding: 14px 52px 14px 14px;
  border: 2px solid #57aa90;
  border-radius: 12px;
  background: #f8fcfa;
}

.toggle-password {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  width: auto;
  min-height: 0;
  border: none;
  background: transparent;
  color: #7e8689;
  cursor: pointer;
  padding: 2px 4px;
  line-height: 1;
}

.toggle-password:hover {
  background: transparent;
}

.toggle-password svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
}

.toggle-password.is-closed::after {
  content: "";
  position: absolute;
  left: 4px;
  top: 9px;
  width: 11px;
  height: 1.6px;
  background: currentColor;
  transform: rotate(-45deg);
}

input:focus {
  outline: none;
  border-color: #2e7d32;
}

button {
  width: 100%;
  padding: 12px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  min-height: 46px;
  cursor: pointer;
}

button:hover {
  background: #1b5e20;
}

.small {
  font-size: 14px;
  margin-top: 15px;
}

.small a {
  color: #2e7d32;
  text-decoration: none;
  font-weight: bold;
}

.success {
  color: green;
  margin-top: 10px;
  font-weight: bold;
}

.success.is-error {
  color: #b00020;
}

.password-rules {
  text-align: left;
  margin: 8px 0 14px;
  padding-left: 18px;
  color: #777;
  font-size: 13px;
}

.password-rules li {
  margin-bottom: 4px;
}

.password-rules li.valid {
  color: #1b5e20;
}

@media (max-width: 768px) {
  .register-container {
    padding: 28px 18px;
    border-radius: 12px;
  }
}

@media (max-width: 420px) {
  h1 {
    font-size: 1.5rem;
  }

  p,
  .small {
    font-size: 0.95rem;
  }

  input,
  button {
    padding: 11px 12px;
    font-size: 16px;
  }
}

@media (max-height: 560px) {
  body {
    align-items: flex-start;
  }

  .register-container {
    margin-top: 10px;
    margin-bottom: 10px;
  }
}

@keyframes floatGlow {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  50% {
    transform: translate3d(20px, -18px, 0) scale(1.08);
  }
  100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  body::before,
  body::after {
    animation: none;
  }
}

</style>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="https://videos.pexels.com/video-files/2878084/2878084-uhd_2560_1440_24fps.mp4" type="video/mp4">
  </video>
  <div class="bg-video-overlay"></div>

  <div class="register-container">
    <h1>Join Green World</h1>
    <p>Create an account to protect nature</p>

    <input type="email" id="email" placeholder="Email">
    <div class="password-wrap">
      <input type="password" id="password" placeholder="Password">
      <button type="button" id="togglePassword" class="toggle-password is-closed" aria-label="Show password">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"></path>
          <circle cx="12" cy="12" r="3.2"></circle>
        </svg>
      </button>
    </div>
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <ul id="passwordRules" class="password-rules">
      <li id="ruleLength">At least 8 characters</li>
      <li id="ruleUpper">At least 1 uppercase letter</li>
      <li id="ruleNumber">At least 1 number</li>
      <li id="ruleSymbol">At least 1 symbol</li>
    </ul>

    <button id="registerBtn">Create Account</button>

    <p id="successMsg" class="success"></p>

    <p class="small">
      Already have an account?
      <a href="loginpage.html">Login</a>
    </p>
  </div>
</body>
<script type="module">
import * as FirebaseApp from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import * as FirebaseAuth from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
console.log("REGISTER_AUTH_SCRIPT_VERSION_2026_02_23_01");

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBnpg1zVQr2-mEPwet80zNExFaPEjls4Hc",
  authDomain: "green-world-project.firebaseapp.com",
  projectId: "green-world-project",
  storageBucket: "green-world-project.firebasestorage.app",
  messagingSenderId: "1096759081626",
  appId: "1:1096759081626:web:1f15a558d2bfcad1b7bd23"
};

const app = FirebaseApp.getApps().length
  ? FirebaseApp.getApp()
  : FirebaseApp.initializeApp(firebaseConfig);
const auth = FirebaseAuth.getAuth(app);
const APP_CHECK_SITE_KEY = window.__APP_CHECK_SITE_KEY__ || "";
if (APP_CHECK_SITE_KEY) {
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider(APP_CHECK_SITE_KEY),
    isTokenAutoRefreshEnabled: true
  });
}

const btn = document.getElementById("registerBtn");
const msg = document.getElementById("successMsg");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const togglePasswordBtn = document.getElementById("togglePassword");
const ruleLength = document.getElementById("ruleLength");
const ruleUpper = document.getElementById("ruleUpper");
const ruleNumber = document.getElementById("ruleNumber");
const ruleSymbol = document.getElementById("ruleSymbol");

FirebaseAuth.onAuthStateChanged(auth, (user) => {
  if (user && user.emailVerified) {
    window.location.href = "index.html";
  }
});

function setMessage(text, isError = false) {
  msg.textContent = text;
  msg.classList.toggle("is-error", isError);
}

function validatePassword(password) {
  return {
    lengthOk: password.length >= 8,
    upperOk: /[A-Z]/.test(password),
    numberOk: /[0-9]/.test(password),
    symbolOk: /[^A-Za-z0-9]/.test(password)
  };
}

function updatePasswordRuleUI(password) {
  const result = validatePassword(password);
  ruleLength.classList.toggle("valid", result.lengthOk);
  ruleUpper.classList.toggle("valid", result.upperOk);
  ruleNumber.classList.toggle("valid", result.numberOk);
  ruleSymbol.classList.toggle("valid", result.symbolOk);
  return result.lengthOk && result.upperOk && result.numberOk && result.symbolOk;
}

btn.addEventListener("click", async () => {
  setMessage("");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = confirmPasswordInput.value;

  if (!email || !password) {
    setMessage("Please enter email and password.", true);
    return;
  }

  if (!updatePasswordRuleUI(password)) {
    setMessage("Password does not meet the requirements.", true);
    return;
  }

  if (password !== confirmPassword) {
    setMessage("Passwords do not match.", true);
    return;
  }

  try {
    // 1) Create user account
    const userCred = await FirebaseAuth.createUserWithEmailAndPassword(auth, email, password);

    // 2) Send verification email
    await FirebaseAuth.sendEmailVerification(userCred.user);

    // 3) Sign out to force verification before login
    await FirebaseAuth.signOut(auth);

    // 4) Show message
    setMessage("Account created. Verification email sent. Check your inbox.");

    setTimeout(() => {
      window.location.href = "loginpage.html";
    }, 3000);

  } catch (err) {
    const friendlyErrors = {
      "auth/email-already-in-use": "An account already exists with this email.",
      "auth/invalid-email": "Invalid email format.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/network-request-failed": "Network error. Check your internet connection."
    };
    setMessage(friendlyErrors[err.code] || err.message || "Account creation failed.", true);
    console.error("Create account error:", err);
  }
});

passwordInput.addEventListener("input", () => {
  updatePasswordRuleUI(passwordInput.value);
});

[document.getElementById("email"), passwordInput, confirmPasswordInput].forEach((input) => {
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      btn.click();
    }
  });
});

togglePasswordBtn.addEventListener("click", () => {
  const isHidden = passwordInput.type === "password";
  passwordInput.type = isHidden ? "text" : "password";
  togglePasswordBtn.classList.toggle("is-closed", !isHidden);
  togglePasswordBtn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
});

</script>
</html>
